name: Build Mitmproxy Binary (macOS 12 x86_64)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Dependencies
        # Removed the '-e' flag and explicitly added pyinstaller
        run: python -m pip install ".[dev]" pyinstaller

      - name: Compile Standalone Binaries
        env:
          MACOSX_DEPLOYMENT_TARGET: "12.0"
          ARCHFLAGS: "-arch x86_64"
        run: python -u release/build.py standalone-binaries

      - name: Upload Standalone Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mitmproxy-macos12-standalone-binary
          path: release/dist/*.tar.gz
