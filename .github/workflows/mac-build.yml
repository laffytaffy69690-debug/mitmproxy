name: Build Mitmproxy (macOS 12 Compatible)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13 # Standard x86_64 Intel Mac runner

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Build Tools
        run: python -m pip install --upgrade pip build

      - name: Build Source and Wheel
        env:
          MACOSX_DEPLOYMENT_TARGET: "12.0"
        run: python -m build

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mitmproxy-macos12-wheel
          path: dist/*.whl
