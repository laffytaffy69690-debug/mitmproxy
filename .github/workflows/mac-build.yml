name: Build Mitmproxy Binary (macOS 12 x86_64)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel # Forces an authentic Intel Mac cloud runner

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Dependencies
        run: python -m pip install ".[dev]" pyinstaller

      - name: Fix PyInstaller Lazy Imports
        # This forces PyInstaller to bundle the missing display files
        run: |
          echo "import urwid.display.html_fragment" >> mitmproxy/tools/console/master.py
          echo "import urwid.display.raw" >> mitmproxy/tools/console/master.py
          echo "import urwid.display.curses" >> mitmproxy/tools/console/master.py
          echo "import urwid.display.web" >> mitmproxy/tools/console/master.py
          echo "import urwid.display.lcd" >> mitmproxy/tools/console/master.py

      - name: Compile Standalone Binaries
        env:
          MACOSX_DEPLOYMENT_TARGET: "12.0"
        run: python -u release/build.py standalone-binaries

      - name: Upload Standalone Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mitmproxy-macos12-standalone-binary
          path: release/dist/*.tar.gz
