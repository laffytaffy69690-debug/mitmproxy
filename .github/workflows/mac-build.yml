name: Build macOS executable

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build-macos:
    name: Build macOS executable (PyInstaller)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Homebrew packages
        run: |
          brew update
          brew install openssl pkg-config || true

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pyinstaller
          # Install the package so its modules and entry points are available
          pip install .

      - name: Build macOS binary with PyInstaller
        run: |
          # Clean previous build artifacts
          rm -rf build dist || true
          # Build one-file executable from the package entrypoint.
          # Adjust the input path if the actual executable entrypoint differs.
          python -m PyInstaller --onefile --name mitmproxy mitmproxy/__main__.py
          # Optionally build mitmdump or other entrypoints:
          # python -m PyInstaller --onefile --name mitmdump mitmproxy/tools/mitmdump.py

      - name: List built artifacts
        run: |
          ls -lh dist || true

      - name: Upload macOS binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: mitmproxy-macos
          path: dist/mitmproxy
